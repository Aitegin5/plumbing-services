<!-- ===== MOBILE NAV (универсальное меню для телефона) ===== -->
<style>
  .mnav-burger { display: none; }
  .mnav { display: none; }
  @media (max-width: 900px) {
    .mnav-burger { display: flex; align-items: center; justify-content: center; position: fixed; top: 18px; right: 16px; z-index: 1001;
      width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.92);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #111; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.10); }
    .mnav-burger svg { width: 22px; height: 22px; }
    body.mnav-open { overflow: hidden; }
    .mnav { display: flex; flex-direction: column; position: fixed; inset: 0; z-index: 1002; background: #fff; color: #111;
      transform: translateX(100%); transition: transform .35s cubic-bezier(.33,.07,.22,.93); visibility: hidden; overflow-y: auto; }
    body.mnav-open .mnav { transform: none; visibility: visible; }
    .mnav-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid rgba(0,0,0,.08); position: sticky; top: 0; background: #fff; }
    .mnav-brand { font-size: 19px; font-weight: 600; letter-spacing: -.3px; }
    .mnav-close { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: rgba(0,0,0,.05); color: #111; cursor: pointer; }
    .mnav-list { display: flex; flex-direction: column; padding: 8px 18px; }
    .mnav-list a { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 14px 2px; font-size: 19px; font-weight: 500;
      color: #111; text-decoration: none; border-bottom: 1px solid rgba(0,0,0,.08); }
    .mnav-list a:active { opacity: .6; }
    .mnav-cta { margin: 16px 18px calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
    .mnav-cta a { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; font-weight: 600; text-decoration: none; font-size: 16px; }
    .mnav-cta .primary { background: #111; color: #fff; }
    .mnav-cta .wa { background: #25D366; color: #fff; }
  }
  /* скрыть нативную CTA-кнопку в навбаре, чтобы не пересекалась с бургером */
  @media (max-width: 900px) { nav .primary-button { display: none !important; } }
</style>
<script>
(function () {
  function collectLinks() {
    var seen = {}, out = [];
    function add(a) {
      var h = a.getAttribute('href');
      var t = (a.textContent || '').replace(/\s+/g, ' ').trim();
      if (h && h.charAt(0) === '#' && h.length > 1 && !seen[h]) {
        seen[h] = 1; out.push({ href: h, text: t });
      }
    }
    var nav = document.querySelector('nav');
    if (nav) nav.querySelectorAll('a[href^="#"]').forEach(add);
    if (out.length < 2) document.querySelectorAll('a[href^="#"]').forEach(add);
    if (out.length < 2) {
      document.querySelectorAll('section[id]').forEach(function (s) {
        var id = s.id;
        if (!seen[id] && id !== 'root' && id !== 'hero') {
          seen[id] = 1;
          out.push({ href: '#' + id, text: id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g, ' ') });
        }
      });
    }
    return out;
  }
  function build() {
    if (document.querySelector('.mnav-burger')) return;
    var root = document.getElementById('root');
    if (root && root.children.length === 0) return; // ждём, пока приложение отрисуется
    var links = collectLinks();
    if (links.length === 0) return; // приложение ещё грузится (Suspense) — ждём реальных ссылок
    var burger = document.createElement('button');
    burger.className = 'mnav-burger';
    burger.setAttribute('aria-label', 'Open menu');
    burger.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>';
    var panel = document.createElement('div');
    panel.className = 'mnav';
    var nav = document.querySelector('nav');
    var brandMatch = (document.title || 'Меню').split(/[|–—-]/)[0].trim().slice(0, 40) || 'Меню';
    if (nav && nav.textContent) { var nt = (nav.textContent || '').trim().split('\n')[0]; if (nt) brandMatch = nt.slice(0, 40); }
    var head = '<div class="mnav-head"><span class="mnav-brand">' + brandMatch + '</span>' +
      '<button class="mnav-close" aria-label="Close menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
    var list = '<div class="mnav-list">' + (links.length ? links.map(function (l) {
      return '<a href="' + l.href + '">' + l.text + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a>';
    }).join('') : '<a href="#contact">Contact</a>') + '</div>';
    var ctaEl = null;
    if (nav) { var cs = nav.querySelectorAll('a'); if (cs.length) ctaEl = cs[cs.length - 1]; }
    var ctaText = ctaEl ? (ctaEl.textContent || '').replace(/\s+/g, ' ').trim() : '';
    var ctaHref = ctaEl ? ctaEl.getAttribute('href') : '#contact';
    var cta = '<div class="mnav-cta">' + (ctaText ? '<a class="primary" href="' + ctaHref + '">' + ctaText + '</a>' : '') +
      '<a class="wa" href="https://wa.me/996500077564" target="_blank" rel="noopener">Написать в WhatsApp</a></div>';
    panel.innerHTML = head + list + cta;
    document.body.appendChild(burger);
    document.body.appendChild(panel);
    function close() { document.body.classList.remove('mnav-open'); }
    burger.addEventListener('click', function () { document.body.classList.add('mnav-open'); });
    panel.querySelector('.mnav-close').addEventListener('click', close);
    panel.querySelectorAll('.mnav-list a, .mnav-cta a').forEach(function (a) { a.addEventListener('click', close); });
  }
  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    if (!document.querySelector('.mnav-burger')) build();
    if (document.querySelector('.mnav-burger') || tries > 100) clearInterval(timer);
  }, 250);
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(build, 600);
  else window.addEventListener('load', function () { setTimeout(build, 600); });
})();
</script>
